# prod 환경: SPRING_PROFILES_ACTIVE=prod -> application-prod.yaml(MariaDB)을 읽도록 설정
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk090-myfirst-api-server
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: myfirst-api-server
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          # dev/prod overlay에서 만드는 ConfigMap(sk090-backend-configmap)을 마운트한다.
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: sk090-backend-configmap
